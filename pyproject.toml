[project]
name = "tick"
version = "0.0.1"
description = "Tick — the always-on agent runtime for Robinhood Agentic accounts. Runs on the user's own machine."
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "mcp>=2.0",
    "pydantic>=2.7",
    "anthropic>=0.40",
    "typer>=0.12",
    "httpx>=0.27",
    "jsonschema>=4.23",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
    "pynacl>=1.6.2",
    "iroh>=1.1.0",
]

[project.scripts]
tick = "tick.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pyyaml>=6.0.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tick"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: opt-in loopback-only integration with a real local binding"]
